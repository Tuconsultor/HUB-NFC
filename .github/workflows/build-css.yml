name: Build Tailwind CSS → tw-out.css

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tw-input.css'
      - '.github/workflows/build-css.yml'

  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-css:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 🎨 Instalar Tailwind CLI y compilar
        run: |
          npm install -g tailwindcss@latest
          tailwindcss -i ./tw-input.css -o ./tw-out.css --minify

      - name: 💾 Verificar resultado
        run: |
          if [ ! -f tw-out.css ]; then
            echo "ERROR: tw-out.css no fue generado"
            exit 1
          fi
          SIZE=$(wc -c < tw-out.css)
          echo "✅ tw-out.css generado: $SIZE bytes"

      - name: 🚀 Commit y push de tw-out.css
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: rebuild tw-out.css [skip ci]"
          file_pattern: tw-out.css
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
